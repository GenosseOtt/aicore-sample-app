# Step 1 — Get the Kyma cluster kubeconfig from the environment binding.
# The binding writes a kubeconfig connection secret to crossplane-system.
apiVersion: environment.btp.sap.crossplane.io/v1alpha1
kind: KymaEnvironmentBinding
metadata:
  name: ott-kyma-binding
spec:
  kymaEnvironmentRef:
    name: ott-kyma
  cloudManagementRef:
    name: ott-cloud-management
  forProvider:
    rotationInterval: "1h"
    ttl: "2h"
  writeConnectionSecretToRef:
    name: ott-kyma-kubeconfig
    namespace: crossplane-system
  providerConfigRef:
    name: account-provider-config
---
# Step 2 — ProviderConfig for provider-kubernetes, targeting the Kyma cluster.
# Depends on ott-kyma-kubeconfig being Ready above.
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: ott-kyma-kubernetes
spec:
  credentials:
    source: Secret
    secretRef:
      name: ott-kyma-kubeconfig
      namespace: crossplane-system
      key: kubeconfig
---
# Step 3 — Push the AI Core credentials secret into the Kyma cluster.
# Reads data from ott-aicore-provider-credentials (control plane) and
# writes it as a Secret named aicore-credentials into the Kyma app namespace.
# watch: true re-syncs whenever the source secret is rotated.
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  name: ott-aicore-secret-in-kyma
spec:
  watch: true
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: aicore-credentials
        namespace: default
      type: Opaque
  references:
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: ott-aicore-credentials
        namespace: crossplane-system
        fieldPath: data
      toFieldPath: data
  providerConfigRef:
    name: ott-kyma-kubernetes
---
# Step 4 — Push the AI Core deployment URL into a ConfigMap in Kyma.
# Reads deploymentUrl from the AI Core Deployment CR status on the control plane
# and writes it to a ConfigMap in Kyma. watch: true keeps it in sync when
# the deployment restarts (new URL after configuration changes).
apiVersion: kubernetes.crossplane.io/v1alpha2
kind: Object
metadata:
  name: ott-aicore-config-in-kyma
spec:
  watch: true
  forProvider:
    manifest:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: aicore-config
        namespace: default
      data:
        AICORE_DEPLOYMENT_URL: ""
  references:
    - patchesFrom:
        apiVersion: aicore.crossplane.io/v1alpha1
        kind: Deployment
        name: ott-aicore-deployment
        fieldPath: status.atProvider.deploymentUrl
      toFieldPath: data.AICORE_DEPLOYMENT_URL
  providerConfigRef:
    name: ott-kyma-kubernetes
