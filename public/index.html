<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAP AI Core Demo</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ui5/webcomponents@2/dist/bundle.esm.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ui5/webcomponents-fiori@2/dist/bundle.esm.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sapFontFamily, "72", Arial, sans-serif); background: #f5f6fa; height: 100vh; display: flex; flex-direction: column; }

    ui5-shellbar { flex-shrink: 0; }

    #chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
      gap: 1rem;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 0.5rem 0;
    }

    .message {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .message.user { flex-direction: row-reverse; }

    .bubble {
      max-width: 72%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.9rem;
    }

    .message.user .bubble {
      background: #0070f3;
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .message.assistant .bubble {
      background: #fff;
      color: #1d2d3e;
      border: 1px solid #d9d9d9;
      border-bottom-left-radius: 2px;
    }

    .message.error .bubble {
      background: #ffd7d7;
      color: #bb0000;
      border: 1px solid #ffaaaa;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      flex-shrink: 0;
    }

    .message.user .avatar { background: #0070f3; color: #fff; }
    .message.assistant .avatar { background: #f0ab00; color: #fff; }
    .message.error .avatar { background: #bb0000; color: #fff; }

    #input-row {
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      background: #fff;
      border: 1px solid #d9d9d9;
      border-radius: 12px;
      padding: 0.5rem;
    }

    #prompt-input {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      font-size: 0.9rem;
      font-family: inherit;
      padding: 0.5rem;
      max-height: 160px;
      min-height: 44px;
      line-height: 1.5;
    }

    #send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #0070f3;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      align-self: flex-end;
      margin-bottom: 2px;
      transition: background 0.15s, transform 0.1s;
    }
    #send-btn:hover:not(:disabled) { background: #0058c4; }
    #send-btn:active:not(:disabled) { transform: scale(0.92); }
    #send-btn:disabled { background: #c8c8c8; cursor: not-allowed; }
    #send-btn svg { width: 17px; height: 17px; }

    .typing-indicator .bubble {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 0.75rem 1.25rem;
    }

    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #aaa;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

<ui5-shellbar primary-title="SAP AI Core Demo" secondary-title="GPT-4o via Generative AI Hub"></ui5-shellbar>

<div id="chat-container">
  <div id="messages"></div>

  <div id="input-row">
    <textarea
      id="prompt-input"
      placeholder="Ask something…"
      rows="1"
    ></textarea>
    <button id="send-btn" aria-label="Send">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script type="module">
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('prompt-input');
  const sendBtn = document.getElementById('send-btn');

  const history = [
    { role: 'system', content: 'You are a helpful AI assistant.' }
  ];

  function appendMessage(role, text) {
    const wrapper = document.createElement('div');
    wrapper.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'You' : role === 'assistant' ? 'AI' : '!';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrapper;
  }

  function showTyping() {
    const wrapper = document.createElement('div');
    wrapper.className = 'message assistant typing-indicator';
    wrapper.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    `;
    messagesEl.appendChild(wrapper);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrapper;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    appendMessage('user', text);
    history.push({ role: 'user', content: text });

    const typing = showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });

      const data = await res.json();
      typing.remove();

      if (!res.ok) {
        appendMessage('error', `Error: ${data.error ?? res.statusText}`);
        history.pop();
      } else {
        appendMessage('assistant', data.reply);
        history.push({ role: 'assistant', content: data.reply });
      }
    } catch (err) {
      typing.remove();
      appendMessage('error', `Network error: ${err.message}`);
      history.pop();
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', send);

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });
</script>

</body>
</html>
